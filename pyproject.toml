[project]
name = "rolulabo"
version = "1.0.0"
description = "BI con aprendizaje de máquina sobre Rolulabo. Proyecto integrador de Aprendizaje de Máquina, Universidad Panamericana."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Gabriel Álvarez Mendoza" },
    { name = "Eduardo Gutiérrez" },
    { name = "Emiliano Luna" },
    { name = "Rodrigo Naranjo Hernández" },
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "streamlit>=1.50",
    "plotly>=5.20",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    # Exportar PDF con Word y PowerPoint (reports/build_entregables.py).
    "pywin32>=306; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
]

[tool.uv]
# Es un proyecto de scripts, no un paquete instalable.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
